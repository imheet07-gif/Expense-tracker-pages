  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif }
  main { max-width:520px; margin:0 auto; padding:48px 16px }
  h1 { font-size:28px; margin:0 0 6px }

  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 18px 16px; margin-bottom:14px; color:inherit; text-decoration:none }

  a.card b { display:block; font-size:18px; margin-bottom:2px }
  a.card span { color:var(--muted); font-size:15px }
  a.card em { display:inline-block; margin-top:12px; padding:10px 16px; background:var(--accent); color:var(--on); border-radius:10px; font-style:normal; font-weight:600 }
